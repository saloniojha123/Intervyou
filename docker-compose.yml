version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: intervyou-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: intervyou-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_ORIGIN=http://localhost:5173
      - MONGO_URI=mongodb://mongo:27017/intervyou
      - JWT_SECRET=${JWT_SECRET:-change_this_in_prod}
      - AGORA_APP_ID=${AGORA_APP_ID:-}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: intervyou-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
      - VITE_WS_URL=ws://localhost:5000/ws/session
      - VITE_AGORA_APP_ID=${AGORA_APP_ID:-}
    depends_on:
      - backend

volumes:
  mongo_data:
